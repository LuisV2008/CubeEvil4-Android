name: APK
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: sudo port/tools/whole_setup_linux.sh --android
      - run: port/tools/whole_build_android.sh --abi arm64-v8a
      - uses: actions/cache@v4
        with: {path: ~/.android/debug.keystore, key: debug-keystore}
      - run: bash gradlew assembleSideloadDebug
        working-directory: port/android-decomp
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: port/android-decomp/app/build/outputs/apk/sideload/debug/*.apk
